{% extends "auth_base.html" %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}
<h1>Recuperar contraseña</h1>
<p class="subtitle mb-4">Ingresa el correo de tu cuenta y te enviaremos un enlace para crear una nueva.</p>
<form action="{% url 'password_reset' %}" method="post">
    {% csrf_token %}
    <div class="mb-4">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control form-control-lg" placeholder="nombre@empresa.cl" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100" data-loading="Enviando...">Enviar enlace</button>
</form>
<p class="text-center mt-4 mb-0"><a href="{% url 'login_signup' %}"><i class="bi bi-arrow-left"></i> Volver a iniciar sesión</a></p>
{% endblock %}
